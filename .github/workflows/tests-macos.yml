name: Tests (macOS)

# Kept apart from tests.yml: GitHub's macOS runners are often out of capacity,
# and a job that is never picked up fails its whole run. Here that only marks
# this workflow, not the Linux/Windows test run.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (macos-15)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
